name = "nu_pogodi_esp32s3"
version = "0.1.0-dev"
description = "Nu Pogodi! Game on ESP32-S3"

authors = ["Vadim Godunko"]
maintainers = ["Vadim Godunko <vgodunko@gmail.com>"]
maintainers-logins = ["godunko"]
licenses = "GPL-3.0-or-later"
tags = ["embedded", "esp", "esp-idf", "esp32s3"]

[configuration]
generate_ada = false
generate_c = false
generate_gpr = true

[environment]
XTENSA_GNU_CONFIG.set = "${CRATE_ROOT}/crates/xtensa-dynconfig/xtensa-dynconfig/xtensa_esp32s3.so"

[[actions]]
type = "pre-build"
command = ["a0b-runtime",
           "--bb-runtimes=crates/bb-runtimes/",
           "--svd=crates/espidf_gnat_runtime/svd/esp32s3.svd",
           "--runtime-description=crates/espidf_gnat_runtime/runtime-esp32s3.json",
           "--no-startup"]

[[depends-on]]
a0b_asynchronous_operations = "*"
a0b_awaits_astc = "*"
a0b_espidf_timer_clock_timer = "*"
a0b_buffers = "*"
a0b_timer = "*"
a0b_tools = "*"
espidfada_driver_spi = "*"
espidf_gnat_runtime = "*"
gnat_xtensa_esp32_elf = "^16"
nu_pogodi = "*"
xtensa_dynconfig = "*"

[[pins]]
a0b_time = { path = "../../a0b-time" }
a0b_tools = { path = "crates/a0b-tools" }
xtensa_dynconfig = { path = "crates/xtensa-dynconfig" }
espidf_gnat_runtime = { path = "crates/espidf_gnat_runtime" }

a0b_espidf_timer_clock_timer = { path='components/a0b_espidf_timer_clock_timer' }
espidfada = { path='components/espidfada' }
espidfada_driver_gpio = { path='components/espidfada_driver_gpio' }
espidfada_driver_spi = { path='components/espidfada_driver_spi' }
#espidfada_timer = { path='components/espidfada_timer' }
nu_pogodi = { path = ".." }
